name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NOTESYOU_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/notesyou.keystore"
            echo "NOTESYOU_KEYSTORE=$RUNNER_TEMP/notesyou.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret NOTESYOU_KEYSTORE_BASE64 not set — APK is signed with a temporary debug key."
          fi

      - name: Build release APK
        env:
          NOTESYOU_KEYSTORE_PASSWORD: ${{ secrets.NOTESYOU_KEYSTORE_PASSWORD }}
          NOTESYOU_KEY_ALIAS: ${{ secrets.NOTESYOU_KEY_ALIAS }}
          NOTESYOU_KEY_PASSWORD: ${{ secrets.NOTESYOU_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/release/app-release.apk "NotesYou-1.0.${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: NotesYou-apk
          path: NotesYou-*.apk
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Заметки 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Заметки в стиле Material 3 Expressive: фигуры, морфинг, куча анимаций.
            Установка: скачайте `NotesYou-1.0.${{ github.run_number }}.apk` и откройте его на телефоне.
          files: NotesYou-*.apk
